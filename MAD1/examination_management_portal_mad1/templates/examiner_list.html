<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Examiner List</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h2>All Examiners</h2>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for examiner in examiners %}
                <tr>
                    <td>{{ examiner.id }}</td>
                    <td>{{ examiner.username }}</td>
                    <td>{{ examiner.department }}</td>
                    <td>{{ examiner.status }}</td>
                    <td>
                        <a href="/examiner_dashboard/{{ examiner.id }}" class="btn btn-sm btn-primary">View Dashboard</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/admin_dashboard" class="btn btn-secondary">Back to Admin</a>
    </div>
</body>
</html>
