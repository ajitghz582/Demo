<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if editing %}Edit Course{% else %}Add Course{% endif %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4" style="max-width:500px">
        <h2>{% if editing %}Edit Course{% else %}Add Course{% endif %}</h2>
        <form action="{% if editing %}/course/edit/{{ course.id }}{% else %}/course{% endif %}" method="POST">
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text" class="form-control" name="code"
                    value="{% if editing %}{{ course.code }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name"
                    value="{% if editing %}{{ course.name }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{% if editing %}{{ course.description }}{% endif %}</textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">
                    {% if editing %}Update{% else %}Add Course{% endif %}
                </button>
                <a href="/admin_dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
