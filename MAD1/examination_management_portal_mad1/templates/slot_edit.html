<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Slot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4" style="max-width:500px">
        <h2>Edit Slot</h2>
        <form action="/slot/edit/{{ slot.id }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Exam Date</label>
                <input type="date" class="form-control" name="exam_date"
                    value="{{ slot.exam_date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" name="start_time"
                    value="{{ slot.start_time.strftime('%H:%M') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">End Time</label>
                <input type="time" class="form-control" name="end_time"
                    value="{{ slot.end_time.strftime('%H:%M') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Maximum Students</label>
                <input type="number" class="form-control" name="max_students"
                    value="{{ slot.max_students }}" min="1" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Update Slot</button>
                <a href="/examiner_slots/{{ slot.examiner_id }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
