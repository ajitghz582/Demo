<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubrics — {{ exam.name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4" style="max-width:600px">
        <h2>Rubrics — {{ exam.name }}</h2>
        <form action="/rubrics/{{ exam.id }}" method="POST">
            <input type="hidden" name="exam_id" value="{{ exam.id }}">
            <div class="mb-3">
                <label class="form-label">Criteria Name</label>
                <input type="text" class="form-control" name="criteria_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Max Marks</label>
                <input type="number" step="0.1" class="form-control" name="max_marks" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Weightage (%)</label>
                <input type="number" step="0.1" class="form-control" name="weightage" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" name="description">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Add Criteria</button>
                <a href="/admin_dashboard" class="btn btn-secondary">Back</a>
            </div>
        </form>

        {% if rubrics %}
        <hr>
        <h5>Existing Rubrics</h5>
        <table class="table table-bordered table-sm">
            <thead class="table-dark">
                <tr>
                    <th>Criteria</th>
                    <th>Max Marks</th>
                    <th>Weightage</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rubrics %}
                <tr>
                    <td>{{ r.criteria_name }}</td>
                    <td>{{ r.max_marks }}</td>
                    <td>{{ r.weightage }}%</td>
                    <td>{{ r.description }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% endif %}
    </div>
</body>
</html>
